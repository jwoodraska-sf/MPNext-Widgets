name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"   # weekly scan

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write   # needed to upload results

    strategy:
      fail-fast: false
      matrix:
        # Override auto-language-detection: list the languages you build with.
        # Common: [javascript-and-typescript, python, go, java-kotlin,
        #          csharp, cpp, rust]
        language: [javascript-and-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Optional: upload results to GitHub Security tab
          output: /tmp/codecheck

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          # Upload to GitHub's code scanning dashboard
          category: "codeql"
